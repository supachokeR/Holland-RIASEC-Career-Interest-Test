function hexDistance(a, b) {
  const d = Math.abs(HEX.indexOf(a) - HEX.indexOf(b));
  return Math.min(d, 6 - d);
}
function getConsistency(a, b) {
  const d = hexDistance(a, b);
  return { distance: d, level: d === 1 ? "สูง" : d === 2 ? "ปานกลาง" : "ต่ำ" };
}
function getDifferentiation(scores) {
  const v = Object.values(scores);
  const range = Math.max(...v) - Math.min(...v);
  return { range, level: range >= 40 ? "สูง" : range >= 20 ? "ปานกลาง" : "ต่ำ" };
}
// ทุกอย่างในหน้าผลคำนวณจาก scores ได้ จึงใช้ซ้ำกับผลย้อนหลังใน history
function derive(scores) {
  const ranked = [...HEX].sort((a, b) => scores[b] - scores[a]);
  return {
    scores, ranked, code: ranked.slice(0, 3).join(""),
    consistency: getConsistency(ranked[0], ranked[1]),
    differentiation: getDifferentiation(scores),
    tieWarning: scores[ranked[2]] === scores[ranked[3]]
  };
}
function calculate({ activities, occupations, abilities }) {
  const scores = {};
  HEX.forEach(c => {
    const actSum = ACTIVITIES.filter(q => q.code === c).reduce((s, q) => s + activities[q.id], 0);
    const actPct = ((actSum - 7) / 28) * 100;
    const occPct = (OCC_ITEMS.filter(o => o.code === c && occupations.has(o.id)).length / 4) * 100;
    const ablPct = ((abilities[c] - 1) / 6) * 100;
    scores[c] = Math.round(actPct * WEIGHT.activity + occPct * WEIGHT.occupation + ablPct * WEIGHT.ability);
  });
  return derive(scores);
}
function careerFit(userCode, occCode) {
  const w = [3, 2, 1];
  let fit = 0;
  [...userCode].forEach((L, i) => {
    const j = occCode.indexOf(L);
    if (j !== -1) fit += w[i] * w[j];
  });
  return Math.round((fit / 14) * 100);
}
function fitLevel(p) {
  return p >= 70 ? { text: "เข้ากันมาก", color: "#10b981" } : p >= 40 ? { text: "เข้ากันพอสมควร", color: "#f59e0b" } : { text: "เข้ากันน้อย", color: "#f43f5e" };
}

function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function seededShuffle(arr, seed) {
  const a = [...arr], rnd = mulberry32(seed % 2147483647);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const HC = { cx: 170, cy: 160, r: 100 };
function hexPoint(i, frac) {
  const a = (-120 + i * 60) * Math.PI / 180;   // R บนซ้าย แล้ววนตามเข็มตามลำดับ HEX
  return [HC.cx + HC.r * frac * Math.cos(a), HC.cy + HC.r * frac * Math.sin(a)];
}
const hexPoly = fracs => fracs.map((f, i) => hexPoint(i, f).map(n => n.toFixed(1)).join(",")).join(" ");

function renderHexagon(scores, opts = {}) {
  const { compare = null, animate = false, top = [], hero = false } = opts;
  const rings = [.25, .5, .75, 1].map(f => `<polygon points="${hexPoly(HEX.map(() => f))}" fill="none" stroke="currentColor" stroke-opacity="${f === 1 ? .35 : .14}" stroke-width="1"/>`).join("");
  const axes = HEX.map((_, i) => { const [x, y] = hexPoint(i, 1); return `<line x1="${HC.cx}" y1="${HC.cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity=".14"/>`; }).join("");
  const frac = s => HEX.map(c => Math.max(s[c], 3) / 100);
  let polys = "";
  if (compare) polys += `<polygon class="hex-poly" points="${hexPoly(frac(compare))}" fill="#f59e0b" fill-opacity=".18" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  if (scores) {
    polys += `<polygon class="hex-poly" points="${hexPoly(frac(scores))}" fill="url(#hexGrad)" fill-opacity=".45" stroke="#8b5cf6" stroke-width="2.5" stroke-linejoin="round"/>`;
    polys += `<g class="hex-poly">${HEX.map((c, i) => { const [x, y] = hexPoint(i, Math.max(scores[c], 3) / 100); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${top.includes(c) ? 5.5 : 3.5}" fill="${COLOR[c]}" stroke="#fff" stroke-width="1.5"/>`; }).join("")}</g>`;
  }
  const labels = HEX.map((c, i) => {
    const [x, y] = hexPoint(i, 1.28), hi = top.includes(c);
    return `<g>${hi ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="18" fill="${COLOR[c]}" fill-opacity=".25"/>` : ""}
      <circle ${hero ? `class="hero-dot" style="animation-delay:${i * .4}s"` : ""} cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="${COLOR[c]}"/>
      <text x="${x.toFixed(1)}" y="${(y + 4.5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${c}</text>
      ${scores ? `<text x="${x.toFixed(1)}" y="${(y + 29).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">${scores[c]}${compare ? ` / ${compare[c]}` : ""}</text>` : ""}</g>`;
  }).join("");
  const heroPoly = hero ? `<polygon class="hero-spin" points="${hexPoly([.85, .5, .7, .9, .45, .6])}" fill="url(#hexGrad)" fill-opacity=".4" stroke="#8b5cf6" stroke-width="2" stroke-linejoin="round"/>` : "";
  return `<svg viewBox="0 0 340 330" class="w-full max-w-sm mx-auto ${animate ? "hex-anim" : ""}" role="img" aria-label="Hexagon RIASEC">
    <defs><linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#d946ef"/></linearGradient></defs>
    ${rings}${axes}${heroPoly}${polys}${labels}</svg>`;
}

  return `<div class="mb-5">
    <div class="flex gap-1.5 text-xs mb-3">${steps.map(([, l], i) => `<span class="px-2.5 py-1 rounded-full ${i === cur ? "bg-violet-500 text-white" : i < cur ? "bg-emerald-500/80 text-white" : "glass-soft"}">${i < cur ? "✓ " : ""}${l}</span>`).join("")}</div>
    <h1 class="text-2xl font-bold">${title}</h1><p class="muted text-sm mt-1">${sub}</p>
    ${pct != null ? `<div class="h-2 rounded-full bg-white/40 dark:bg-white/10 mt-3 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-fuchsia-500 transition-all" style="width:${pct}%"></div></div>` : ""}

function insightsFor(rec, d) {
  const out = [];
  if (Math.max(...Object.values(rec.scores)) < 40) out.push(["🌱", "ยังไม่พบความสนใจที่ชัดเจน อาจเกิดจากความเหนื่อยล้าหรือยังไม่ได้ลองทำสิ่งต่าง ๆ มากพอ"]);
  if (d.differentiation.level === "ต่ำ") out.push(["🧩", "ความสนใจของคุณกระจายหลายด้าน ลองทดลองทำกิจกรรมจริง ฝึกงาน หรือคุยกับคนในอาชีพก่อนตัดสินใจ"]);
  if (d.consistency.level === "ต่ำ") out.push(["↔️", "ความสนใจ 2 อันดับแรกอยู่ตรงข้ามกันบน hexagon อาจต้องหางานที่ผสมทั้งสองด้าน หรือทำงานอดิเรกเติมอีกด้าน"]);
  if (d.tieWarning) { const alt = d.ranked[0] + d.ranked[1] + d.ranked[3]; out.push(["⚖️", `อันดับ 3 และ 4 ของคุณคะแนนเท่ากัน รหัสทางเลือกที่ควรพิจารณาด้วยคือ <b>${alt}</b>`]); }
  if (rec.durationSec < 90) out.push(["⏱️", "คุณใช้เวลาทำน้อยกว่า 90 วินาที ผลอาจไม่สะท้อนตัวตนจริง ลองทำใหม่อย่างตั้งใจอีกครั้ง"]);
  if (!out.length) out.push(["✨", "โปรไฟล์ของคุณค่อนข้างชัดเจนและสอดประสานกัน ใช้รหัสนี้เป็นจุดเริ่มต้นสำรวจอาชีพได้เลย"]);
  return out;
}

  return `<div class="flex flex-wrap items-end justify-between gap-2 mb-4">

      <button data-action="copy" class="btn btn-sm btn-ghost">📋 คัดลอกสรุป</button></div>
  </div>

  <section class="glass p-6 text-center">

function explorerList() {
  const ex = state.explorer, uc = userCode(), q = ex.q.trim().toLowerCase();
  let list = CAREERS.map(c => ({ c, fit: uc ? careerFit(uc, c.code) : null }))
    .filter(({ c }) => (!q || (c.name + " " + c.field + " " + c.desc + " " + c.code).toLowerCase().includes(q))
      && (!ex.field || c.field === ex.field)
      && [...ex.codes].every(L => c.code.includes(L)));
  if (ex.sort === "fit" && uc) list.sort((a, b) => b.fit - a.fit);
  else list.sort((a, b) => a.c.name.localeCompare(b.c.name, "th"));
  return `<p class="text-xs muted mb-2">พบ ${list.length} อาชีพ</p>` +
    (list.length ? `<div class="space-y-2">${list.map(({ c, fit }) => careerCard(c, fit)).join("")}</div>` : `<div class="text-center muted py-8">ไม่พบอาชีพที่ตรงกับเงื่อนไข 🔍</div>`);
}

const VIEWS = { landing: viewLanding, about: viewAbout, profile: viewProfile, partA: viewPartA, partB: viewPartB, partC: viewPartC, result: viewResult, explorer: viewExplorer, history: viewHistory };

function render() {
  $("#app").innerHTML = header() + `<main class="max-w-5xl mx-auto px-4 py-6 pb-16"><div class="view" data-view-name="${state.view}">${VIEWS[state.view]()}</div></main><div id="modal"></div>`;
  state.fresh = false;
}
function go(view) {
  if (view === "partA") state.cursor = Math.max(pageIds(state.index).findIndex(id => !state.activities[id]), 0);
  state.view = view;
  saveProgress();
  render();
  window.scrollTo(0, 0);
}
function showModal(title, text, confirmLabel, fn) {
  modalFn = fn;
  $("#modal").innerHTML = `<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50" data-action="modal-close">
    <div class="glass p-6 max-w-sm w-full !bg-white/90 dark:!bg-slate-800/95" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
      <h3 class="font-semibold text-lg">${title}</h3><p class="text-sm muted mt-2">${text}</p>
      <div class="flex justify-end gap-2 mt-5"><button data-action="modal-close" class="btn btn-sm btn-ghost">ยกเลิก</button>
        <button data-action="modal-ok" class="btn btn-sm text-white bg-rose-500">${confirmLabel}</button></div></div></div>`;
}
function closeModal() { modalFn = null; const m = $("#modal"); if (m) m.innerHTML = ""; }

/* =====================================================================
   ACTIONS
   ===================================================================== */
function startTest() { resetTest(); state.startedAt = Date.now(); go("profile"); }
function next() {
  if (state.view === "profile") return go("partA");
  if (state.view === "partA") {
    if (!pageDone(state.index)) return toast("ตอบให้ครบทุกข้อในหน้านี้ก่อนนะ 🙏");
    if (state.index < PAGES - 1) { state.index++; return go("partA"); }
    return go("partB");
  }
  if (state.view === "partB") return go("partC");
  if (state.view === "partC") return finish();
}
function prev() {
  if (state.view === "profile") return go("landing");
  if (state.view === "partA") { if (state.index > 0) { state.index--; return go("partA"); } return go("profile"); }
  if (state.view === "partB") { state.index = PAGES - 1; return go("partA"); }
  if (state.view === "partC") return go("partB");
}
function answer(id, v) {
  state.activities[id] = v;
  const ids = pageIds(state.index), nxt = ids.findIndex(i => !state.activities[i]);
  state.cursor = nxt === -1 ? Math.min(ids.indexOf(id) + 1, ids.length - 1) : nxt;
  saveProgress(); render();
}
function finish() {
  const missing = ORDER.findIndex(id => !state.activities[id]);
  if (missing !== -1) { state.index = Math.floor(missing / PAGE_SIZE); toast("ยังตอบ Part A ไม่ครบ"); return go("partA"); }
  const r = calculate({ activities: state.activities, occupations: state.occupations, abilities: state.abilities });
  const now = Date.now();
  const rec = {
    id: "r_" + now, date: new Date(now).toISOString(),
    name: state.profile.name.trim(), status: state.profile.status,
    targetCareer: state.profile.hasTarget ? state.profile.targetCareer : "",
    durationSec: Math.max(1, Math.round((now - state.startedAt) / 1000)),
    scores: r.scores, code: r.code
  };
  state.history.unshift(rec);
  if (!store.set(K.history, state.history)) toast("บันทึกผลลงเครื่องไม่สำเร็จ");
  resetTest();
  state.result = rec; state.fresh = true;
  go("result");
}
function summaryText(rec) {
  const d = derive(rec.scores);
  const top = CAREERS.map(c => ({ n: c.name, f: careerFit(d.code, c.code) })).sort((a, b) => b.f - a.f).slice(0, 5);
  return [
    `CareerHex — ผล Holland Code${rec.name ? " ของ " + rec.name : ""} (${fmtDate(rec.date)})`,
    `รหัส: ${d.code} (${[...d.code].map(L => TYPES[L].nick).join(" · ")})`,
    `คะแนน: ${HEX.map(c => `${c} ${rec.scores[c]}`).join(" | ")}`,
    `Consistency: ${d.consistency.level} · Differentiation: ${d.differentiation.level} (ช่วง ${d.differentiation.range})`,
    `อาชีพแนะนำ: ${top.map(t => `${t.n} (${t.f}%)`).join(", ")}`,
    rec.targetCareer ? `อาชีพในใจ: ${rec.targetCareer} (${careerFit(d.code, (CAREERS.find(c => c.name === rec.targetCareer) || {}).code || "")}%)` : "",
    "หมายเหตุ: แบบทดสอบเพื่อการเรียนรู้ ไม่ใช่แบบทดสอบมาตรฐานเชิงพาณิชย์"
  ].filter(Boolean).join("\n");
}
function copyText(text) {
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = 0;
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) { /* ignore */ }
    ta.remove(); toast(ok ? "คัดลอกสรุปแล้ว 📋" : "คัดลอกไม่สำเร็จ");
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast("คัดลอกสรุปแล้ว 📋"), fallback);
  else fallback();
}
function exportJson(rec) {
  const d = derive(rec.scores);
  const data = { ...rec, ranked: d.ranked, consistency: d.consistency, differentiation: d.differentiation, tieWarning: d.tieWarning,
    careers: CAREERS.map(c => ({ name: c.name, code: c.code, fit: careerFit(d.code, c.code) })).sort((a, b) => b.fit - a.fit).slice(0, 10) };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = `careerhex-${d.code}-${rec.id}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const ACTIONS = {
  go: el => go(el.dataset.view),
  theme: () => { state.theme = state.theme === "dark" ? "light" : "dark"; store.set(K.theme, state.theme); applyTheme(); render(); },
  start: startTest,
  "start-new": () => hasProgress() ? showModal("เริ่มทำใหม่?", "คำตอบที่ทำค้างไว้จะถูกลบ", "เริ่มใหม่", startTest) : startTest(),
  resume: () => go(loadProgress() || "profile"),
  status: el => { state.profile.status = el.dataset.v; saveProgress(); render(); },
  "has-target": el => { state.profile.hasTarget = el.dataset.v === "1"; saveProgress(); render(); },
  answer: el => answer(+el.dataset.id, +el.dataset.v),
  occ: el => {
    const id = el.dataset.id, on = !state.occupations.has(id);
    on ? state.occupations.add(id) : state.occupations.delete(id);
    el.classList.toggle("on", on); el.setAttribute("aria-pressed", on);
    const ck = el.querySelector("span"); ck.classList.toggle("flex", on); ck.classList.toggle("hidden", !on);
    $("#occ-count").textContent = state.occupations.size;
    saveProgress();
  },
  next, prev,
  print: () => window.print(),
  "export-json": () => exportJson(state.result),
  copy: () => copyText(summaryText(state.result)),
  "ex-code": el => { const c = el.dataset.v, s = state.explorer.codes; s.has(c) ? s.delete(c) : s.add(c); render(); },
  open: el => { const r = state.history.find(x => x.id === el.dataset.id); if (r) { state.result = r; go("result"); } },
  del: el => showModal("ลบผลครั้งนี้?", "ลบแล้วไม่สามารถกู้คืนได้", "ลบ", () => {
    state.history = state.history.filter(x => x.id !== el.dataset.id);
    state.compare = state.compare.filter(x => x !== el.dataset.id);
    if (state.result && state.result.id === el.dataset.id) state.result = null;
    store.set(K.history, state.history); render();
  }),
  "clear-all": () => showModal("ล้างข้อมูลทั้งหมด?", "ประวัติผลการทดสอบและคำตอบที่ทำค้างไว้ในเครื่องนี้จะถูกลบทั้งหมด", "ล้างข้อมูล", () => {
    store.del(K.history); state.history = []; state.compare = []; state.result = null; resetTest(); go("landing"); toast("ล้างข้อมูลแล้ว");
  }),
  "modal-close": closeModal,
  "modal-ok": () => { const fn = modalFn; closeModal(); if (fn) fn(); }
};

function onInput(e) {
  const el = e.target, kind = el.dataset && el.dataset.input;
  if (!kind) return;
  if (kind === "name") { state.profile.name = el.value; saveProgress(); }
  else if (kind === "target") { state.profile.targetCareer = el.value; saveProgress(); }
  else if (kind === "ability") { state.abilities[el.dataset.code] = +el.value; $("#abv-" + el.dataset.code).textContent = el.value; saveProgress(); }
  else if (kind === "q") { state.explorer.q = el.value; $("#explorer-list").innerHTML = explorerList(); }
  else if (kind === "field" || kind === "sort") { state.explorer[kind] = el.value; $("#explorer-list").innerHTML = explorerList(); }
  else if (kind === "compare" && e.type === "change") {
    const id = el.dataset.id;
    if (el.checked) { state.compare.push(id); if (state.compare.length > 2) state.compare.shift(); }
    else state.compare = state.compare.filter(x => x !== id);
    render();
  }
}

function init() {
  state.theme = store.get(K.theme, null) || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme();
  const h = store.get(K.history, []);
  state.history = Array.isArray(h) ? h.filter(r => r && r.scores && r.code) : [];
  const step = loadProgress();          // refresh กลางคัน → กลับมาที่ part เดิม
  if (step) { state.view = step; if (step === "partA") state.cursor = Math.max(pageIds(state.index).findIndex(id => !state.activities[id]), 0); }
  render();

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.action];
    if (fn) fn(el);
  });
  document.addEventListener("input", onInput);
  document.addEventListener("change", onInput);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") return closeModal();
    if (modalFn || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.matches && e.target.matches("input, select, textarea")) return;
    if (state.view === "partA" && /^[1-5]$/.test(e.key)) { e.preventDefault(); return answer(pageIds(state.index)[state.cursor], +e.key); }
    if (!TEST_VIEWS.includes(state.view)) return;
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  });
  // พิมพ์เป็นโทนสว่างเสมอ
  let wasDark = false;
  window.addEventListener("beforeprint", () => { wasDark = document.documentElement.classList.contains("dark"); document.documentElement.classList.remove("dark"); });
  window.addEventListener("afterprint", () => { if (wasDark) document.documentElement.classList.add("dark"); });
}

if (typeof document !== "undefined") init();
</script>
</body>
